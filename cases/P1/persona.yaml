maturity_reason: Tem site próprio e um sistema de reservas simples, mas o controle de quartos e de limpeza vive em papel e planilhas; nenhuma automação de comunicação com hóspedes.
tools_in_use:
  - site próprio com formulário de reserva
  - sistema de reservas simples (agendamento por e-mail)
  - planilhas para quartos e limpeza
  - WhatsApp no celular da recepção
pain_points:
  - Chegadas e saídas de hóspedes em dias de pico confundem a recepção e a governança
  - Camareiras recebem a lista de quartos por um bilhete de papel, às vezes desatualizado
  - Não existe histórico do hóspede, quem voltou é tratado como primeira viagem
  - Reservas diretas disputam espaço com várzea de mensagens em três canais diferentes
brand_tone: Acolhedor e montanhês, como quem recebe visita em casa de família na serra
